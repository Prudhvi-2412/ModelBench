name: Model Bench CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Run backend tests
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check backend/src tests scripts run_experiment.py
      - name: Validate example datasets
        env:
          PYTHONPATH: backend/src
        run: |
          python scripts/validate_dataset.py general_qa
          python scripts/validate_dataset.py rag_qa
          python scripts/validate_dataset.py hallucination

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate default, Transformers, and GPU configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.real-model.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile gpu config --quiet
