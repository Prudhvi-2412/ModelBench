[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbench-api"
version = "0.1.0"
description = "Local-first API for the Model Bench AI engineering platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
transformers = [
  "transformers>=4.45,<6",
  "torch>=2.5",
  "accelerate>=1.0",
]
embeddings = [
  "sentence-transformers>=3.0,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
