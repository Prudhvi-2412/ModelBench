experiment:
  description: Baseline general QA run using the local development provider.
  dataset: general_qa
  mode: model
  model: local-development
  embedding_model: hashing-384
  prompt_template: "Answer the question using the context when available. Question: {question}\nContext: {context}\nAnswer:"
  chunk_size: 1000
  chunk_overlap: 150
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  retrieval_strategy: dense
  top_k: 5
  temperature: 0
  max_tokens: 128
  top_p: 1
  seed: 42
